name: Rastrear Analistas Financieros

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

jobs:
  ejecutar-rastreo:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Configurar entorno de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías necesarias
        run: |
          python -m pip install --upgrade pip
          !pip install google-genai

      - name: Ejecutar script de rastreo
        env:
          GEMINI_API_KEY: "${{ secrets.GEMINI_API_KEY }}"
        run: |
          python script.py

      - name: Subir informe como Artifact descargable
        uses: actions/upload-artifact@v4
        with:
          name: informe-analistas-diario
          path: informe_analistas_*.txt
